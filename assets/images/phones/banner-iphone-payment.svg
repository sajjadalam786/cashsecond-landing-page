<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%">
  <defs>
    <!-- Soft Light Theme Ambient Glow -->
    <radialGradient id="b2_glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Natural Titanium Chassis -->
    <linearGradient id="b2_nat_titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E2E0"/>
      <stop offset="30%" stop-color="#C5C5C2"/>
      <stop offset="60%" stop-color="#9E9E9B"/>
      <stop offset="100%" stop-color="#737370"/>
    </linearGradient>

    <!-- Black Titanium Chassis -->
    <linearGradient id="b2_black_titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="40%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="b2_back_natural" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#DCDCDA"/>
      <stop offset="50%" stop-color="#C9C9C6"/>
      <stop offset="100%" stop-color="#B2B2AF"/>
    </linearGradient>

    <!-- Screen Glass & Wallpaper Gradients -->
    <linearGradient id="b2_screen_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B49"/>
      <stop offset="40%" stop-color="#004C82"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <radialGradient id="b2_lens_glass" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="b2_shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    
    <filter id="b2_card_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Soft Radial Ambient -->
  <circle cx="280" cy="190" r="190" fill="url(#b2_glow)"/>

  <!-- ==========================================
       PHONE 1 (NATURAL TITANIUM BACK VIEW)
       ========================================== -->
  <g filter="url(#b2_shadow)" transform="translate(100, 35) rotate(-6 130 170)">
    <!-- Outer Titanium Bevel -->
    <rect x="0" y="0" width="186" height="328" rx="36" fill="url(#b2_nat_titanium)" stroke="#FFF" stroke-opacity="0.6" stroke-width="1.5"/>
    
    <!-- Matte Frosted Back Glass -->
    <rect x="3.5" y="3.5" width="179" height="321" rx="33" fill="url(#b2_back_natural)"/>
    
    <!-- Apple Logo in Polished Mirror Titanium -->
    <path d="M93 148 C93 141 97.5 137 97.5 137 C95 133 90.5 133 88.5 133 C84 133 80.5 135.5 78.5 135.5 C76.5 135.5 73.5 133 69.5 133 C62.5 133 56 138.5 56 149.5 C56 157.5 60.5 169.5 66.5 178.5 C69.5 182.5 73 187 77.5 187 C81.5 187 83 184.5 87.5 184.5 C92 184.5 93.5 187 97.5 187 C102 187 105 183 108 178.5 C111.5 173.5 113 169 113.5 168 C113 168 105 165 105 156 C105 148.5 111 144.5 111.5 144 C107.5 138 101.5 137.5 99.5 137.5 C97.5 137.5 94.5 148 93 148 Z M91 131 C93.5 128 95 124 94.5 120 C91 120.5 86.5 122.5 84 125.5 C82 128 80.5 132 81 136 C85 136.5 89 134 91 131 Z" fill="#71716E" fill-opacity="0.85" transform="translate(6, 12) scale(0.85)"/>

    <!-- Camera Plateau -->
    <rect x="12" y="14" width="76" height="76" rx="20" fill="#C5C5C2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.12))"/>
    
    <!-- Top-Left Lens -->
    <circle cx="34" cy="36" r="16" fill="url(#b2_nat_titanium)"/>
    <circle cx="34" cy="36" r="14" fill="#0A0F1D"/>
    <circle cx="34" cy="36" r="10" fill="url(#b2_lens_glass)"/>
    <circle cx="31" cy="33" r="3" fill="#93C5FD" fill-opacity="0.8"/>

    <!-- Bottom-Left Lens -->
    <circle cx="34" cy="68" r="16" fill="url(#b2_nat_titanium)"/>
    <circle cx="34" cy="68" r="14" fill="#0A0F1D"/>
    <circle cx="34" cy="68" r="10" fill="url(#b2_lens_glass)"/>
    <circle cx="31" cy="65" r="3" fill="#93C5FD" fill-opacity="0.8"/>

    <!-- Right Telephoto Lens -->
    <circle cx="66" cy="52" r="16" fill="url(#b2_nat_titanium)"/>
    <circle cx="66" cy="52" r="14" fill="#0A0F1D"/>
    <circle cx="66" cy="52" r="10" fill="url(#b2_lens_glass)"/>
    <circle cx="63" cy="49" r="3" fill="#93C5FD" fill-opacity="0.8"/>

    <!-- TrueTone Flash & LiDAR -->
    <circle cx="66" cy="26" r="5.5" fill="#FFFBEB" stroke="#A8A8A5" stroke-width="1.5"/>
    <circle cx="66" cy="76" r="4" fill="#1E293B"/>
  </g>

  <!-- ==========================================
       PHONE 2 (FRONT OLED DISPLAY & PAYMENT CONFIRMATION)
       ========================================== -->
  <g filter="url(#b2_shadow)" transform="translate(255, 20) rotate(4 100 170)">
    <!-- Outer Black Titanium Frame -->
    <rect x="0" y="0" width="194" height="340" rx="38" fill="url(#b2_black_titanium)" stroke="#FFF" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Super Retina XDR OLED Display -->
    <rect x="4" y="4" width="186" height="332" rx="34" fill="url(#b2_screen_grad)"/>

    <!-- Dynamic Island Pill -->
    <rect x="67" y="14" width="60" height="17" rx="8.5" fill="#000000"/>
    <circle cx="114" cy="22.5" r="3.5" fill="#1E293B"/>
    <circle cx="114" cy="22.5" r="1.5" fill="#38BDF8" fill-opacity="0.7"/>

    <!-- Lockscreen Header -->
    <text x="97" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="600" fill="#E0F2FE" letter-spacing="0.5" text-anchor="middle">Instant Payout Success</text>

    <!-- CashSecond Payment Receipt Card -->
    <g transform="translate(12, 85)" filter="url(#b2_card_shadow)">
      <rect x="0" y="0" width="162" height="154" rx="18" fill="#FFFFFF"/>
      
      <!-- Verified Green Checkmark -->
      <circle cx="81" cy="30" r="16" fill="#16A34A"/>
      <path d="M74 30 L79 35 L89 25" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="81" y="62" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Payment Completed</text>
      <text x="81" y="76" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#64748B" text-anchor="middle">UPI / Instant Bank IMPS</text>
      
      <!-- Amount -->
      <text x="81" y="105" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#0071E3" text-anchor="middle" letter-spacing="-0.5">₹78,000</text>
      
      <!-- Divider -->
      <line x1="16" y1="118" x2="146" y2="118" stroke="#F1F5F9" stroke-width="1.5"/>
      
      <!-- Security & Device note -->
      <text x="81" y="132" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" fill="#0F172A" text-anchor="middle">iPhone 15 Pro • 256GB</text>
      <text x="81" y="144" font-family="-apple-system, sans-serif" font-size="7" font-weight="500" fill="#16A34A" text-anchor="middle">🔒 Complete Data Wipe Verified</text>
    </g>

    <!-- Bottom Home Indicator Bar -->
    <rect x="67" y="324" width="60" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Floating Fast Payout Pill (Top Right) -->
  <g transform="translate(390, 50)" filter="url(#b2_card_shadow)">
    <rect x="0" y="0" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="18" cy="17" r="9" fill="#E0F2FE"/>
    <text x="18" y="21" font-family="sans-serif" font-size="10" fill="#0071E3" text-anchor="middle">⚡</text>
    <text x="34" y="16" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#0F172A">ZERO DELAY</text>
    <text x="34" y="25.5" font-family="-apple-system, sans-serif" font-size="7" font-weight="600" fill="#0071E3">On-Spot Transfer</text>
  </g>
</svg>
