<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%">
  <defs>
    <!-- Ambient & Lighting Gradients -->
    <radialGradient id="b1_glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#C29B7F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D141F" stop-opacity="0"/>
    </radialGradient>

    <!-- Desert Titanium Chassis Gradients -->
    <linearGradient id="b1_titanium_edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFD3"/>
      <stop offset="25%" stop-color="#D9BCA6"/>
      <stop offset="50%" stop-color="#BA9880"/>
      <stop offset="75%" stop-color="#E8D1C0"/>
      <stop offset="100%" stop-color="#8F6E56"/>
    </linearGradient>

    <linearGradient id="b1_back_glass" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EFE2D8"/>
      <stop offset="40%" stop-color="#E4D0C2"/>
      <stop offset="80%" stop-color="#D2B9A6"/>
      <stop offset="100%" stop-color="#BF9F8B"/>
    </linearGradient>

    <!-- Screen Glass & Wallpaper Gradients -->
    <linearGradient id="b1_screen_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="80%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <linearGradient id="b1_screen_glow" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#E8C39E" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#9A7B61" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0B1320" stop-opacity="0"/>
    </linearGradient>

    <!-- Camera Module & Lens Gradients -->
    <linearGradient id="b1_cam_island" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6D3C5"/>
      <stop offset="50%" stop-color="#D3BCAB"/>
      <stop offset="100%" stop-color="#BA9F8B"/>
    </linearGradient>

    <radialGradient id="b1_lens_glass" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#1E293B"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="b1_shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="b1_badge_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="280" cy="190" r="180" fill="url(#b1_glow)"/>

  <!-- ==========================================
       PHONE 1 (BACK VIEW - ANGLE LEFT)
       ========================================== -->
  <g filter="url(#b1_shadow)" transform="translate(110, 30) rotate(-7 130 170)">
    <!-- Outer Titanium Bevel -->
    <rect x="0" y="0" width="186" height="330" rx="36" fill="url(#b1_titanium_edge)" stroke="#FFF" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Matte Frosted Back Glass -->
    <rect x="3.5" y="3.5" width="179" height="323" rx="33" fill="url(#b1_back_glass)"/>
    
    <!-- Apple Logo in Polished Mirror Titanium -->
    <path d="M93 148 C93 141 97.5 137 97.5 137 C95 133 90.5 133 88.5 133 C84 133 80.5 135.5 78.5 135.5 C76.5 135.5 73.5 133 69.5 133 C62.5 133 56 138.5 56 149.5 C56 157.5 60.5 169.5 66.5 178.5 C69.5 182.5 73 187 77.5 187 C81.5 187 83 184.5 87.5 184.5 C92 184.5 93.5 187 97.5 187 C102 187 105 183 108 178.5 C111.5 173.5 113 169 113.5 168 C113 168 105 165 105 156 C105 148.5 111 144.5 111.5 144 C107.5 138 101.5 137.5 99.5 137.5 C97.5 137.5 94.5 148 93 148 Z M91 131 C93.5 128 95 124 94.5 120 C91 120.5 86.5 122.5 84 125.5 C82 128 80.5 132 81 136 C85 136.5 89 134 91 131 Z" fill="#9C7D66" fill-opacity="0.85" transform="translate(6, 12) scale(0.85)"/>

    <!-- Camera Plateau -->
    <rect x="12" y="14" width="76" height="76" rx="20" fill="url(#b1_cam_island)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.15))"/>
    
    <!-- Top-Left Lens -->
    <circle cx="34" cy="36" r="16" fill="url(#b1_titanium_edge)"/>
    <circle cx="34" cy="36" r="14" fill="#0A0F1D"/>
    <circle cx="34" cy="36" r="10" fill="url(#b1_lens_glass)"/>
    <circle cx="31" cy="33" r="3" fill="#60A5FA" fill-opacity="0.7"/>

    <!-- Bottom-Left Lens -->
    <circle cx="34" cy="68" r="16" fill="url(#b1_titanium_edge)"/>
    <circle cx="34" cy="68" r="14" fill="#0A0F1D"/>
    <circle cx="34" cy="68" r="10" fill="url(#b1_lens_glass)"/>
    <circle cx="31" cy="65" r="3" fill="#60A5FA" fill-opacity="0.7"/>

    <!-- Right Telephoto Lens -->
    <circle cx="66" cy="52" r="16" fill="url(#b1_titanium_edge)"/>
    <circle cx="66" cy="52" r="14" fill="#0A0F1D"/>
    <circle cx="66" cy="52" r="10" fill="url(#b1_lens_glass)"/>
    <circle cx="63" cy="49" r="3" fill="#60A5FA" fill-opacity="0.7"/>

    <!-- TrueTone Flash & LiDAR -->
    <circle cx="66" cy="26" r="5.5" fill="#FFFBEB" stroke="#D3BCAB" stroke-width="1.5"/>
    <circle cx="66" cy="76" r="4" fill="#1E293B"/>
  </g>

  <!-- ==========================================
       PHONE 2 (FRONT OLED DISPLAY - HERO FOCUS)
       ========================================== -->
  <g filter="url(#b1_shadow)" transform="translate(260, 20) rotate(5 100 170)">
    <!-- Outer Desert Titanium Frame -->
    <rect x="0" y="0" width="194" height="340" rx="38" fill="url(#b1_titanium_edge)" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Super Retina XDR OLED Display -->
    <rect x="4" y="4" width="186" height="332" rx="34" fill="url(#b1_screen_grad)"/>
    <rect x="4" y="4" width="186" height="332" rx="34" fill="url(#b1_screen_glow)"/>

    <!-- Dynamic Island Pill -->
    <rect x="67" y="14" width="60" height="17" rx="8.5" fill="#000000"/>
    <circle cx="114" cy="22.5" r="3.5" fill="#1E293B"/>
    <circle cx="114" cy="22.5" r="1.5" fill="#3B82F6" fill-opacity="0.6"/>

    <!-- Lockscreen Typography -->
    <text x="97" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="600" fill="#E2E8F0" letter-spacing="0.5" text-anchor="middle">Tuesday, 24 September</text>
    <text x="97" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1" text-anchor="middle">9:41</text>

    <!-- CashSecond Live Lockscreen Notification Card -->
    <g transform="translate(14, 140)" filter="url(#b1_badge_shadow)">
      <rect x="0" y="0" width="158" height="96" rx="16" fill="rgba(255, 255, 255, 0.94)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>
      
      <!-- App Header Row -->
      <circle cx="18" cy="18" r="8" fill="#0071E3"/>
      <text x="18" y="21.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFF" text-anchor="middle">2</text>
      <text x="32" y="21" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0B0D10">CashSecond</text>
      <text x="138" y="20" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">now</text>

      <!-- Value Content -->
      <text x="14" y="42" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B">iPhone 16 Pro Max • 256GB</text>
      <text x="14" y="64" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#0071E3" letter-spacing="-0.5">₹1,05,000</text>
      
      <!-- Payout Tag -->
      <rect x="14" y="73" width="98" height="15" rx="7.5" fill="#DCFCE7"/>
      <text x="63" y="83.5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#15803D" text-anchor="middle">✓ Instant Doorstep Cash</text>
    </g>

    <!-- Bottom Home Indicator Bar -->
    <rect x="67" y="324" width="60" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Floating Star Badge (Top Right) -->
  <g transform="translate(415, 60)" filter="url(#b1_badge_shadow)">
    <rect x="0" y="0" width="85" height="32" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="14" y="20" font-family="sans-serif" font-size="12" fill="#FBBF24">★</text>
    <text x="28" y="16" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFF">TOP VALUE</text>
    <text x="28" y="25" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="500" fill="#94A3B8">Guaranteed</text>
  </g>
</svg>
